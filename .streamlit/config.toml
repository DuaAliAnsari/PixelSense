# Locks the app to a light theme. This is what fixes the "white text on white
# input" problem: it happened when the browser/OS was in dark mode and
# Streamlit switched its default text colour to white.
[theme]
base = "light"
primaryColor = "#4F46C6"
backgroundColor = "#F4F5FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B1D3A"
font = "sans serif"

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
